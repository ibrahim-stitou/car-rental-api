name: Deploy Backend (Laravel)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/ges-cars-admin/backend

            # 1. Récupérer le message du dernier commit
            COMMIT_MSG=$(git log -1 --pretty=%B)

            # 2. Récupérer les changements distant
            git fetch origin main

            # 3. Détecter si composer.lock a été modifié
            COMPOSER_CHANGED=$(git diff --name-only HEAD origin/main | grep "composer.lock" || true)

            # 4. Appliquer le git pull
            git pull origin main

            # 5. Mettre à jour les dépendances si composer.lock a changé
            if [ -n "$COMPOSER_CHANGED" ]; then
                echo "Composer dependencies changed. Running composer install..."
                composer install --no-dev --optimize-autoloader
            fi

            # 6. Exécuter les migrations si [migrate] est dans le commit
            if echo "$COMMIT_MSG" | grep -qi "\[migrate\]"; then
                echo "Migration flag detected. Running migrations..."
                php artisan migrate --force
            fi

            # 7. Recharger le cache Laravel
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
